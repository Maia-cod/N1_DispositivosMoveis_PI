plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.exemplo.barberagenda'
    compileSdk 35

    defaultConfig {
        applicationId "com.exemplo.barberagenda"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Credenciais de demonstracao (seed). Nao representam segredos reais.
        buildConfigField "String", "DEMO_DONO_LOGIN", "\"carlos\""
        buildConfigField "String", "DEMO_DONO_SENHA", "\"123\""
        buildConfigField "String", "DEMO_CLIENTE_LOGIN", "\"ana\""
        buildConfigField "String", "DEMO_CLIENTE_SENHA", "\"123\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    implementation 'androidx.room:room-runtime:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
}
